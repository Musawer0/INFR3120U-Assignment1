<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <title>Musawer Beissed - Contact Me</title>
    <link rel="stylesheet" type="text/css" href="css/laptop.css">
</head>
<body>
<!-- Main page wrapper -->
    <div id="wrapper">
        <header id="banner">
            <h1>Musawer Beissed</h1>
            <h2>Networking &amp; IT Security | Ontario Tech University</h2>
        </header>

<!-- Navigation bar -->
        <nav id="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact Me</a></li>
            </ul>
        </nav>

<!-- Page Content -->
        <article id="main-content">
            <section class="form-container">
                <h3>Contact Form</h3>
                <p>Send me your questions, comments, and project-related queries!</p>

                <form action="mailto:AbdulMusawer.Beissed@ontariotechu.net" method="post" enctype="text/plain">
                    <p>
                        <label for="name">Your Name:</label><br>
                        <input type="text" id="name" name="name" size="35" required>
                    </p>
                    <p>
                        <label for="email">Your Email:</label><br>
                        <input type="email" id="email" name="email" size="35" required>
                    </p>
                    <p>
                        <label for="phone">Cell No.:</label><br>
                        <input type="tel" id="phone" name="phone" size="35" required>
                    </p>
                    <p>
                        <label for="comments">Message / Query:</label><br>
                        <textarea id="comments" name="comments" rows="6" cols="45" required></textarea>
                    </p>
                    <p>
                        <label for="robot-check">*What is 2+2? (So I know you aren't a robot):</label><br>
                        <input type="number" id="robot-check" name="robot-check" required>
                    </p>
                    <p>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset Form">
                    </p>
                </form>
            </section>
            <div class="clear"></div>
        </article>

<!-- Footer -->
        <footer id="footer">
            <p>Contact: <a href="mailto:AbdulMusawer.Beissed@ontariotechu.net">AbdulMusawer.Beissed@ontariotechu.net</a></p>
            <p>&copy; 2026 Musawer Beissed. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
